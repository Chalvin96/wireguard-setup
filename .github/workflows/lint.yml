name: ansible-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.2,<25"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Debug lint results (temporary)
        continue-on-error: true
        run: |
          echo "::error::VERSIONS $(pip freeze | grep -iE '^(ansible|ruamel|yamllint)' | tr '\n' ' ')"
          cd ansible
          ansible-lint -p 2>&1 | grep -E ':[0-9]+:' | head -6 | while read -r line; do echo "::error::LINT ${line}"; done

      - name: Run ansible-lint
        run: cd ansible && ansible-lint
