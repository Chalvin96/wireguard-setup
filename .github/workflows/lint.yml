name: ansible-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.2,<25"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Debug lint results (temporary)
        continue-on-error: true
        run: |
          echo "::error::HEAD $(git rev-parse HEAD) PARENTS $(git log --pretty=%P -1 HEAD)"
          echo "::error::SHA256 $(sha256sum ansible/roles/caddy/tasks/main.yml | cut -c1-16) LINES $(wc -l < ansible/roles/caddy/tasks/main.yml)"
          echo "::error::CONTENT $(sed -n '74,84p' ansible/roles/caddy/tasks/main.yml | tr '\n' '|' | head -c 800)"
          cd ansible
          echo "::error::SOLO $(ansible-lint -p roles/caddy/tasks/main.yml 2>/dev/null | grep -E ':[0-9]+:' | head -3 | tr '\n' ' ')"

      - name: Run ansible-lint
        run: cd ansible && ansible-lint
