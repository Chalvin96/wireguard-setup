name: ansible-lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify private configuration stays encrypted
        run: |
          for file in ansible/group_vars/all/{config,vault}.yml; do
            head -n 1 "$file" | grep -q '^\$ANSIBLE_VAULT;' || exit 1
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ansible-lint
        run: pip install "ansible-core>=2.16,<2.18" "ansible-lint>=24.2,<25"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Check cleanup and backup scripts
        run: |
          bash tests/test-ci-cleanup.sh
          bash tests/test-penpot-backup.sh
          python tests/test_proxmox_health.py

      - name: Check network isolation and VPS firewall
        run: |
          sudo apt-get install -y --no-install-recommends nftables iproute2
          python tests/test_app_isolation.py render "$RUNNER_TEMP/app-isolation.nft"
          sudo unshare --net "$(command -v python)" tests/test_app_isolation.py "$RUNNER_TEMP/app-isolation.nft"
          python tests/test_vps_firewall.py render "$RUNNER_TEMP/vps-firewall.nft"
          sudo unshare --net "$(command -v python)" tests/test_vps_firewall.py "$RUNNER_TEMP/vps-firewall.nft"

      - name: Run ansible-lint
        run: cd ansible && ansible-lint
