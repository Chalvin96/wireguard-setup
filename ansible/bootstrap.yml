---
# Run once per host as your existing named user.
# New host:        ./run.sh bootstrap --limit <host> -e ansible_user=<your_user> --ask-pass --ask-become-pass
#                  (use -e, not -u: the inventory sets ansible_user=deploy, which overrides -u)
# Authorize a key: ./run.sh bootstrap   (from a machine already authorized as deploy)
# Prerequisites: ansible-galaxy collection install -r requirements.yml
- name: Bootstrap deploy user
  hosts: 'all:!mikrotik'
  gather_facts: false
  become: true
  vars:
    bootstrap_ssh_pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Create deploy group
      ansible.builtin.group:
        name: deploy
        state: present

    - name: Create deploy user
      ansible.builtin.user:
        name: deploy
        group: deploy
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create .ssh directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        mode: "0700"
        owner: deploy
        group: deploy

    - name: Add operator SSH public key (the machine running bootstrap)
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ bootstrap_ssh_pubkey }}"
        state: present

    - name: Add authorized operator machines from config
      ansible.posix.authorized_key:
        user: deploy
        key: "{{ item }}"
        state: present
      loop: "{{ deploy_authorized_keys | default([]) }}"

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Disable password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PasswordAuthentication"
        line: "PasswordAuthentication no"
        state: present
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
