---
- name: Add Flyt alerts and dashboard to the existing monitoring stack
  hosts: monitoring
  become: true
  tasks:
    - name: Apply shared alert provisioning
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: alerting

    - name: Apply Flyt dashboard provisioning
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: flyt
