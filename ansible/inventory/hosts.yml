# Committed inventory: addresses come from the vault-encrypted
# group_vars/all/config.yml, so this file holds no real IPs.
all:
  vars:
    ansible_user: deploy
  children:
    ingress:
      hosts:
        ingress-01:
          ansible_host: "{{ ingress_ip }}"
    edge:
      hosts:
        edge-01:
          ansible_host: "{{ edge_ip }}"
    monitoring:
      hosts:
        monitoring-01:
          ansible_host: "{{ monitoring_ip }}"
    tools:
      hosts:
        tools-01:
          ansible_host: "{{ tools_ip }}"
    mikrotik:
      vars:
        ansible_user: admin # RouterOS user (key-based SSH, no agent)
        ansible_ssh_use_tty: false # RouterOS drops into interactive mode with -tt
        ansible_ssh_common_args: "-o ControlMaster=no -o ControlPersist=no -o BatchMode=yes"
      hosts:
        mikrotik-01:
          ansible_host: "{{ mikrotik_ip }}"
