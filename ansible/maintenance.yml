---
- name: Bound idle CI storage
  hosts: tools
  become: true
  roles:
    - ci-maintenance

- name: Reduce hypervisor swap preference
  hosts: proxmox
  become: true
  tasks:
    - name: Prefer reclaiming cache over swapping guest memory
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "10"
        sysctl_file: /etc/sysctl.d/90-vm-swappiness.conf
        sysctl_set: true
        reload: true

- name: Apply storage budgets and swap pressure alerts
  hosts: monitoring
  become: true
  tasks:
    - name: Apply shared alert provisioning
      ansible.builtin.import_role:
        name: monitoring
        tasks_from: alerting
