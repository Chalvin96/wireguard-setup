---
- name: Install cron and cleanup locking
  ansible.builtin.apt:
    name: [cron, util-linux]
    state: present

- name: Install Node Exporter for host and cleanup metrics
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present

- name: Create cleanup metrics directory
  ansible.builtin.file:
    path: /var/lib/prometheus/node-exporter
    state: directory
    mode: "0755"

- name: Enable the Node Exporter textfile collector
  ansible.builtin.lineinfile:
    path: /etc/default/prometheus-node-exporter
    regexp: "^ARGS="
    line: 'ARGS="--collector.textfile.directory=/var/lib/prometheus/node-exporter"'
  notify: Restart Node Exporter

- name: Install CI cleanup
  ansible.builtin.template:
    src: ci-cleanup.sh.j2
    dest: /usr/local/sbin/ci-cleanup
    mode: "0750"

- name: Schedule CI cleanup every 30 minutes
  ansible.builtin.cron:
    name: Clean unused CI storage
    cron_file: ci-cleanup
    user: root
    minute: "*/30"
    job: /usr/bin/timeout --kill-after=30s 30m /usr/local/sbin/ci-cleanup 2>&1 | /usr/bin/logger -t ci-cleanup

- name: Enable cron
  ansible.builtin.systemd:
    name: cron
    enabled: true
    state: started
  when: not ansible_check_mode
