---
docker_apps_user: apps
docker_apps_home: /var/lib/apps
docker_apps_subuid: 231072
docker_ci_subuid: 296608
docker_ci_cpu_quota: "300%"
docker_ci_memory_max: "4G"
# Only the explicit migration playbook may leave the old daemon running.
docker_rootless_migration: false
docker_rootless_accounts:
  - name: "{{ docker_apps_user }}"
    home: "{{ docker_apps_home }}"
    subuid: "{{ docker_apps_subuid }}"
  - name: "{{ github_runner_user }}"
    home: "{{ github_runner_home }}"
    subuid: "{{ docker_ci_subuid }}"
