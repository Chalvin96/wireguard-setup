---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart apps daemon
  ansible.builtin.systemd:
    scope: user
    name: docker
    state: restarted
    daemon_reload: true
  become: true
  become_user: "{{ docker_apps_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[docker_apps_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd[docker_apps_user][1] }}/bus"
  when: not ansible_check_mode
