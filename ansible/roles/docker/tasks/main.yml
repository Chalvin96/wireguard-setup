---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false

- name: Install Docker CE via shared apt-repo ritual
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apt_repo.yml"
  vars:
    apt_repo_name: docker
    apt_repo_key_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    apt_repo_repo: >-
      deb [arch={{ docker_dpkg_arch.stdout }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    apt_repo_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
