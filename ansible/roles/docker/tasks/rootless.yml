---
- name: Create the applications daemon account
  ansible.builtin.user:
    name: "{{ docker_apps_user }}"
    home: "{{ docker_apps_home }}"
    shell: /bin/bash
    groups: "" # never the root-equivalent docker group
    append: false
    system: true
    create_home: true
    password_lock: true

- name: Protect the applications account home
  ansible.builtin.file:
    path: "{{ docker_apps_home }}"
    owner: "{{ docker_apps_user }}"
    group: "{{ docker_apps_user }}"
    state: directory
    mode: "0700"

- name: Read account IDs
  ansible.builtin.getent:
    database: passwd

- name: Read existing subordinate ID assignments
  ansible.builtin.command: "awk -F: '{print $1, $2, $3}' {{ item }}"
  loop:
    - /etc/subuid
    - /etc/subgid
  register: docker_subordinate_ids
  changed_when: false
  check_mode: false

- name: Validate the subordinate ID range before assigning it
  ansible.builtin.assert:
    that:
      - docker_apps_subuid | int >= 65536
      - >-
        docker_apps_user == item.split()[0] or
        docker_apps_subuid | int + 65536 <= item.split()[1] | int or
        docker_apps_subuid | int >= item.split()[1] | int + item.split()[2] | int
      - docker_apps_user != item.split()[0] or (docker_apps_subuid | int == item.split()[1] | int and item.split()[2] | int == 65536)
    fail_msg: Subordinate UID/GID ranges overlap or differ from existing assignments; choose unused ranges, never remap live data.
  loop: "{{ docker_subordinate_ids.results | map(attribute='stdout_lines') | flatten }}"
  loop_control:
    label: "{{ item.split()[0] }}"

- name: Assign subordinate UIDs and GIDs
  ansible.builtin.lineinfile:
    path: "{{ item }}"
    regexp: "^{{ docker_apps_user }}:"
    line: "{{ docker_apps_user }}:{{ docker_apps_subuid }}:65536"
  loop:
    - /etc/subuid
    - /etc/subgid

- name: Create rootless configuration directories
  ansible.builtin.file:
    path: "{{ docker_apps_home }}/{{ item }}"
    state: directory
    owner: "{{ docker_apps_user }}"
    group: "{{ docker_apps_user }}"
    mode: "0700"
  loop:
    - .config/docker
    - .config/systemd/user

- name: Configure rootless Docker log rotation
  ansible.builtin.template:
    src: daemon.json.j2
    dest: "{{ docker_apps_home }}/.config/docker/daemon.json"
    owner: "{{ docker_apps_user }}"
    group: "{{ docker_apps_user }}"
    mode: "0600"
  notify: Restart apps daemon

- name: Create the cgroup delegation directory
  ansible.builtin.file:
    path: "/etc/systemd/system/user@{{ getent_passwd[docker_apps_user][1] }}.service.d"
    state: directory
    mode: "0755"

- name: Delegate controllers to the rootless user manager
  ansible.builtin.copy:
    dest: "/etc/systemd/system/user@{{ getent_passwd[docker_apps_user][1] }}.service.d/docker.conf"
    content: |
      [Unit]
      RequiresMountsFor={{ docker_apps_home }}

      [Service]
      Delegate=cpu cpuset io memory pids
    mode: "0644"
  notify: Reload systemd

- name: Load delegation configuration before starting the user manager
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false
  when: not ansible_check_mode

- name: Enable rootless daemon startup without interactive login
  ansible.builtin.command: "loginctl enable-linger {{ docker_apps_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ docker_apps_user }}"

- name: Start the applications user manager
  ansible.builtin.systemd:
    name: "user@{{ getent_passwd[docker_apps_user][1] }}.service"
    state: started
  when: not ansible_check_mode

- name: Install the rootless Docker user service
  ansible.builtin.command: dockerd-rootless-setuptool.sh install --force
  args:
    creates: "{{ docker_apps_home }}/.config/docker/rootless-installed"
  become: true
  become_user: "{{ docker_apps_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[docker_apps_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd[docker_apps_user][1] }}/bus"
  when: not ansible_check_mode

- name: Mark the completed rootless Docker installation
  ansible.builtin.copy:
    dest: "{{ docker_apps_home }}/.config/docker/rootless-installed"
    content: "Managed rootless Docker installation\n"
    owner: "{{ docker_apps_user }}"
    group: "{{ docker_apps_user }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Write application prune service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ docker_apps_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ docker_apps_user }}"
    group: "{{ docker_apps_user }}"
    mode: "0644"
  vars:
    docker_prune_uid: "{{ getent_passwd[docker_apps_user][1] }}"
  loop:
    - docker-prune.service
    - docker-prune.timer

- name: Start the rootless daemon and the application prune timer
  ansible.builtin.systemd:
    scope: user
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  become_user: "{{ docker_apps_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd[docker_apps_user][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ getent_passwd[docker_apps_user][1] }}/bus"
  loop:
    - docker.service
    - docker-prune.timer
  when: not ansible_check_mode

- name: Flush rootless daemon handlers after the service is installed
  ansible.builtin.meta: flush_handlers
