---
github_runner_tool_cache: "{{ github_runner_home }}/_tool"
github_runner_node_versions:
  - "22.23.3"
  - "24.21.0"
# The rootful CI daemon and ci.slice, which holds every runner and CI container.
github_runner_docker_data_root: "{{ github_runner_home }}/docker"
github_runner_slice_cpu_quota: "500%"
github_runner_slice_memory_max: "11G"
# New inbound connections from this interface to CI containers are dropped.
github_runner_lan_interface: "{{ ansible_default_ipv4.interface }}"
