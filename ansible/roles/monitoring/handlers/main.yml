---
- name: Restart monitoring stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    remove_orphans: true
    state: restarted

- name: Reload Prometheus
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    services: [prometheus]
    recreate: always
  when: not ansible_check_mode
