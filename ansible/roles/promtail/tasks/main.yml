---
- name: Ensure apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add Grafana apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: Install Promtail
  ansible.builtin.apt:
    name: promtail
    state: present
    update_cache: true

- name: Ensure promtail group exists
  ansible.builtin.group:
    name: promtail
    state: present

- name: Create promtail data directory
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0750"

- name: Write Promtail config
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/promtail/config.yml
    mode: "0644"
  notify: Restart Promtail

- name: Add promtail user to caddy and adm groups (log access)
  ansible.builtin.user:
    name: promtail
    groups:
      - caddy
      - adm
    append: true
  notify: Restart Promtail

- name: Install ACL support for app container logs
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
  when: app_promtail_enabled | default(false)

- name: Validate app container log settings
  ansible.builtin.assert:
    that:
      - app_promtail_log_paths is defined
      - app_promtail_log_paths | length > 0
    fail_msg: >-
      Set at least one app_promtail_log_paths entry when app_promtail_enabled
      is true.
  when: app_promtail_enabled | default(false)

- name: Allow promtail to traverse Docker data directory
  ansible.posix.acl:
    path: /var/lib/docker
    entity: promtail
    etype: user
    permissions: x
    state: present
  when: app_promtail_enabled | default(false)
  notify: Restart Promtail

- name: Allow promtail to read existing app container logs
  ansible.posix.acl:
    path: /var/lib/docker/containers
    entity: promtail
    etype: user
    permissions: rX
    state: present
    recursive: true
  when: app_promtail_enabled | default(false)
  notify: Restart Promtail

- name: Allow promtail to read new app container logs
  ansible.posix.acl:
    path: /var/lib/docker/containers
    entity: promtail
    etype: user
    permissions: rX
    default: true
    state: present
    recursive: true
  when: app_promtail_enabled | default(false)
  notify: Restart Promtail

- name: Enable and start Promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
