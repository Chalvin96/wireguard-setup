---
- name: Install Promtail via shared apt-repo ritual
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apt_repo.yml"
  vars:
    apt_repo_name: grafana
    apt_repo_key_url: https://apt.grafana.com/gpg.key
    apt_repo_repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    apt_repo_packages:
      - promtail

- name: Ensure promtail group exists
  ansible.builtin.group:
    name: promtail
    state: present

- name: Create promtail data directory
  ansible.builtin.file:
    path: /var/lib/promtail
    state: directory
    owner: promtail
    group: promtail
    mode: "0750"

- name: Write Promtail config
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/promtail/config.yml
    mode: "0644"
  notify: Restart Promtail

- name: Add promtail user to caddy and adm groups (log access)
  ansible.builtin.user:
    name: promtail
    groups:
      - caddy
      - adm
    append: true
  notify: Restart Promtail

- name: Enable and start Promtail
  ansible.builtin.systemd:
    name: promtail
    enabled: true
    state: started
