---
- name: Disable ufw (conflicts with nftables)
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  failed_when: false

- name: Deploy blocklist firewall drop-in
  ansible.builtin.include_tasks: ../../../tasks/nft_dropin.yml
  vars:
    nft_dropin_name: blocklist
    nft_dropin_template: blocklist.nft.j2

- name: Create banagent system user
  ansible.builtin.user:
    name: banagent
    system: true
    shell: /bin/bash
    create_home: true
    home: /home/banagent
    state: present

- name: Create banagent .ssh directory
  ansible.builtin.file:
    path: /home/banagent/.ssh
    state: directory
    mode: "0700"
    owner: banagent
    group: banagent

- name: Deploy ban-ip wrapper script
  ansible.builtin.copy:
    src: ban-ip
    dest: /usr/local/bin/ban-ip
    mode: "0755"
    owner: root
    group: root

- name: Configure sudoers for banagent
  ansible.builtin.copy:
    dest: /etc/sudoers.d/banagent
    content: "banagent ALL=(root) NOPASSWD: /usr/local/bin/ban-ip\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Deploy vps_ban public key with forced command
  ansible.builtin.template:
    src: authorized_keys.j2
    dest: /home/banagent/.ssh/authorized_keys
    mode: "0600"
    owner: banagent
    group: banagent
