---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true

- name: Write wg0.conf
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: "0600"
    owner: root
    group: root
  notify: Restart wg-quick@wg0

- name: Create wg0-peers.conf if not present
  ansible.builtin.copy:
    content: ""
    dest: /etc/wireguard/wg0-peers.conf
    mode: "0600"
    owner: root
    group: root
    force: false

- name: Route home LAN through edge WireGuard peer
  ansible.builtin.replace:
    path: /etc/wireguard/wg0-peers.conf
    regexp: >-
      AllowedIPs = {{ wireguard_client_ip | regex_escape }}/32(?!,\s*{{ wireguard_lan_cidr | regex_escape }})
    replace: "AllowedIPs = {{ wireguard_client_ip }}/32, {{ wireguard_lan_cidr }}"
  notify: Restart wg-quick@wg0

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
